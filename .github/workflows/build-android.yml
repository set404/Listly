name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - run: chmod +x android/gradlew

      - run: npx cap sync android

      # A fresh runner has no debug.keystore, so the Android Gradle Plugin
      # would generate a brand-new random one on every run — a different
      # SHA-1 (and a broken Google Sign-In) each build. Restore a pinned
      # keystore to android/ci-debug.keystore instead — an explicit path
      # that android/app/build.gradle's debug signingConfig points at
      # directly, since this runner's implicit default debug keystore
      # location turned out NOT to be ~/.android/debug.keystore (that file
      # was being written and read back fine, but Gradle was actually
      # signing with a totally different, unpinned keystore — verified by
      # extracting the real signing cert from a built APK). Pointing at an
      # explicit file removes that ambiguity for good.
      - name: Restore CI debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is empty or not set — add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d --ignore-garbage > android/ci-debug.keystore
          echo "Restored keystore: $(wc -c < android/ci-debug.keystore) bytes, sha256=$(sha256sum android/ci-debug.keystore | cut -d' ' -f1)"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Print debug keystore SHA-1
        run: |
          keytool -list -v \
            -keystore android/ci-debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            | grep -E "SHA1:|SHA256:"

      - name: Verify APK is actually signed with the pinned keystore
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: listly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
